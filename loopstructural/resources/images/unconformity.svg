  <line x1="14" y1="52" x2="24" y2="34" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="34" y1="50" x2="46" y2="30" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Fresh, flat rock deposited on top of the erosion surface -->
