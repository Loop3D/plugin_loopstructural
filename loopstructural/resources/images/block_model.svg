<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Isometric block of voxels, top layer and lower layer in two unit colours -->
  <polygon points="32,4 60,18 32,32 4,18" fill="#f4b942" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="4,18 32,32 32,60 4,46" fill="#c97b4a" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="60,18 32,32 32,60 60,46" fill="#8f5530" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Block (cell) divisions -->
  <line x1="18" y1="11" x2="46" y2="25" stroke="#333" stroke-width="2"/>
  <line x1="46" y1="11" x2="18" y2="25" stroke="#333" stroke-width="2"/>
  <line x1="18" y1="25" x2="18" y2="53" stroke="#333" stroke-width="2"/>
  <line x1="46" y1="25" x2="46" y2="53" stroke="#333" stroke-width="2"/>
  <line x1="4" y1="32" x2="32" y2="46" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="32" x2="32" y2="46" stroke="#333" stroke-width="2"/>
</svg>
