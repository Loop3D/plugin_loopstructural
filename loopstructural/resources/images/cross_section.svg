  <line x1="52" y1="6" x2="52" y2="22" stroke="#a33" stroke-width="6" stroke-linecap="round"/>
  <line x1="12" y1="14" x2="52" y2="14" stroke="#a33" stroke-width="6" stroke-linecap="round"/>
</svg>
