<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Layered ground block -->
  <rect x="4" y="30" width="56" height="30" fill="#c97b4a" stroke="#333" stroke-width="4"/>
  <rect x="4" y="30" width="56" height="14" fill="#f4b942" stroke="#333" stroke-width="4"/>
  <!-- Ground surface -->
  <line x1="2" y1="30" x2="62" y2="30" stroke="#333" stroke-width="4"/>
  <!-- Bold section line (A to A') with end ticks, above the ground -->
