<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Left block (upthrown side) -->
  <g>
    <rect x="4" y="6" width="26" height="40" fill="#6ca96c" stroke="#333" stroke-width="4"/>
    <rect x="4" y="6" width="26" height="20" fill="#f4b942" stroke="#333" stroke-width="4"/>
  </g>
  <!-- Right block (downthrown side), shifted down -->
  <g>
    <rect x="34" y="18" width="26" height="40" fill="#6ca96c" stroke="#333" stroke-width="4"/>
    <rect x="34" y="18" width="26" height="20" fill="#f4b942" stroke="#333" stroke-width="4"/>
  </g>
  <!-- Fault plane -->
  <line x1="30" y1="4" x2="34" y2="60" stroke="#a33" stroke-width="5" stroke-linecap="round"/>
  <!-- Relative-motion arrows along the fault -->
  <polygon points="24,12 30,12 27,4" fill="#a33"/>
  <polygon points="37,52 43,52 40,60" fill="#a33"/>
</svg>
