name: "✅ Linter"

on:
  push:
    branches:
      - main
    paths:
      - '**.py'

  pull_request:
    branches:
      - main
    paths:
      - '**.py'

env:
  PROJECT_FOLDER: "loopstructural"
  PYTHON_VERSION: 3.9
permissions:
  contents: read

jobs:
  lint-py:
    name: Python 🐍

    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: "pip"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black "ruff==0.15.22"
      - name: Check formatting with black
        run: |
          black --check --diff .
      - name: Lint with ruff
        run: |
          ruff check ${{env.PROJECT_FOLDER}}
