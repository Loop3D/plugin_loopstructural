on:
  push:
    branches:
      - main
env:
    PACKAGE_NAME: plugin_loopstructural
permissions:
  actions: write
  contents: write
  pull-requests: write

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v5
        id: release
      - name: debug
        run: echo "release_created=${{ steps.release.outputs.loopstructural--tag_name }}"

    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.loopstructural--tag_name }}
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    steps:
      # Tags and releases made with GITHUB_TOKEN do not start other workflows,
      # but workflow_dispatch made with GITHUB_TOKEN does.
      - name: Trigger releaser.yml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run releaser.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
